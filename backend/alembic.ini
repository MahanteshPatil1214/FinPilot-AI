[alembic]
# Path to migration scripts (resolved relative to this file).
script_location = %(here)s/migrations
# Allow `alembic` to import the `app` package from the backend directory.
prepend_sys_path = .
# Use the timestamp template so revision ordering is obvious in git.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The URL is resolved at runtime by migrations/env.py from DATABASE_URL / the
# application settings. Left blank here so no credentials are committed.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
